name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          python3 -m unittest discover -s deploy/tests -p 'test_*.py'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Previous-version upgrade and rollback compatibility
        run: bash deploy/tests/old-version-compat.sh
      - name: Verify reviewed migration fingerprints
        run: |
          python3 deploy/migration_review.py "$(git rev-parse HEAD)" --output /tmp/reviewed-migration.sh
          bash -n /tmp/reviewed-migration.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Theme, localization and layout regressions
        working-directory: frontend
        run: pnpm exec vitest run src/utils/__tests__/theme.spec.ts src/utils/__tests__/branding.spec.ts src/components/common/__tests__/ThemeToggle.spec.ts src/views/__tests__/HomeView.compact.spec.ts src/router/__tests__/title.spec.ts
      - name: Commercial onboarding and community regressions
        working-directory: frontend
        run: pnpm exec vitest run src/components/community/__tests__ src/components/keys/__tests__/UseKeyModal.spec.ts src/views/user/__tests__/CommercialExperience.spec.ts src/views/user/__tests__/ChannelStatusV1.states.spec.ts src/views/user/__tests__/ChannelStatusV2.states.spec.ts src/i18n/__tests__/localesMessageCompile.spec.ts src/i18n/__tests__/localesNoKeyCollision.spec.ts
      - name: Production frontend build
        working-directory: frontend
        run: pnpm run build
      - name: Full frontend regression suite
        working-directory: frontend
        run: pnpm test:run

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh

  security:
    uses: ./.github/workflows/security-scan.yml

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record database migration compatibility
        id: schema
        run: echo "fingerprint=$(find backend/migrations -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Build the exact application revision
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/slothwatching/sub9api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Slothwatching/sub9api
            org.opencontainers.image.revision=${{ github.sha }}
            io.sub9api.migrations=${{ steps.schema.outputs.fingerprint }}
          build-args: |
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-ready:
    if: always()
    needs: [shell, test, frontend, golangci-lint, release-helpers, security, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks failed: ' + ', '.join(failed))
          PYCODE

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release-ready, image]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-azure.yml
    with:
      image_digest: ${{ needs.image.outputs.digest }}
      source_sha: ${{ github.sha }}
